# Align Go version with go.mod (same as ref-projects/cli)
[tools]
go = { version = '1.25.6' }
golangci-lint = '2.8.0'

[tasks.fmt]
description = "Run gofmt"
run = "gofmt -s -w ."

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks."test:integration"]
description = "Run integration tests only"
run = "go test -tags=integration ./cmd/rekal/cli/integration_test/..."

[tasks."test:ci"]
description = "Run all tests (unit + integration) with race detection"
run = """
go test -tags=integration -race ./...
python3 -m unittest discover -s scripts/tests -v
"""

[tasks."test:coverage"]
description = "Run all tests and report statement coverage (HTML report in coverage.html)"
run = """
go test -tags=integration -coverprofile=coverage.out -coverpkg=./cmd/rekal/cli/... ./...
go tool cover -func=coverage.out | tail -1
go tool cover -html=coverage.out -o coverage.html
echo "open coverage.html for the line-by-line view"
"""

[tasks.lint]
description = "Run linters (gofmt check + golangci-lint)"
run = """
unformatted=$(gofmt -l -s .)
if [ -n "$unformatted" ]; then
  echo "These files need formatting. Run: mise run fmt"
  echo "$unformatted"
  exit 1
fi
# Release validate runs lint after a full race suite + llama build; 5m
# was timing out on package load (context deadline exceeded).
golangci-lint run --timeout=10m ./...
"""

[tasks."fetch-extensions"]
description = "Download the DuckDB FTS extension for this platform if it isn't committed (linux/arm64, darwin/amd64). No-op when the blob is already present."
run = "./scripts/fetch-fts-extension.sh"

[tasks.build]
description = "Build the CLI"
depends = ["fetch-extensions"]
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -ldflags "-X github.com/rekal-dev/rekal-cli/cmd/rekal/cli.Version=${VERSION}" -o rekal ./cmd/rekal
"""

[tasks."build:all"]
description = "Build for all platforms (snapshot)"
run = "goreleaser build --snapshot --clean"

[tasks."check:readme-pin"]
description = "Check that README's REKAL_VERSION install pin matches the newest release"
run = """
set -euo pipefail
pinned=$(grep -oE 'REKAL_VERSION=v[0-9]+\\.[0-9]+\\.[0-9]+' README.md | sort -u)
count=$(printf '%s\\n' "$pinned" | grep -c . || true)
if [ "$count" -ne 1 ]; then
  echo "README pins disagree with each other:"
  printf '%s\\n' "$pinned"
  exit 1
fi
pinned=${pinned#REKAL_VERSION=}
# Same redirect the installer uses, so this check needs no API budget either.
latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \\
  https://github.com/rekal-dev/rekal-cli/releases/latest)
latest=${latest##*/releases/tag/}
if [ "$pinned" != "$latest" ]; then
  echo "README pins $pinned, newest release is $latest. Update README.md."
  exit 1
fi
echo "README pin $pinned matches the newest release"
"""
