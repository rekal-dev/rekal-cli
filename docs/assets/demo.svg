<text x="34" y="110" fill="#ffffff" clip-path="url(#c3)" xml:space="preserve">git commit -m 'feat(dispatch): retry webhooks with exponential backoff'   # post-commit hook captures the session</text>
</g>
<text class="r r4" x="20" y="130" fill="#c9d1d9" xml:space="preserve">[main 5885c99] feat(dispatch): retry webhooks with exponential backoff</text>
<g class="r r6">
<text x="20" y="170" fill="#59d499">$</text>
<clipPath id="c6"><rect class="ty6" x="34" y="157" height="20" width="0"/></clipPath>
<text x="34" y="170" fill="#ffffff" clip-path="url(#c6)" xml:space="preserve">claude "We're adding retries to the webhook dispatcher. Should we just use a fixed 5s delay?"</text>
</g>
<text class="r r8" x="20" y="210" fill="#c8a2f0" xml:space="preserve">● Skill(rekal)</text>
<text class="r r9" x="20" y="230" fill="#c8a2f0" xml:space="preserve">● Bash(rekal "webhook dispatcher retry delay backoff policy")</text>
<text class="r r10" x="36" y="250" fill="#7ab7ff" xml:space="preserve">INJECT top=0.84 gap=0.84 1 seeds</text>
<text class="r r11" x="36" y="270" fill="#767e8a" xml:space="preserve">  s1 conf=0.84 t0 "Webhook dispatch needs retries. Simplest version is a constant wait betwee…</text>
<text class="r r12" x="36" y="290" fill="#7ab7ff" xml:space="preserve">KNOWLEDGE README.md=0.40</text>
<text class="r r13" x="20" y="310" fill="#c8a2f0" xml:space="preserve">● Bash(rekal query --session 01KZ2W9QKYVJQ2KTEZ1W21DS7X --offset 0 --limit 6)</text>
<text class="r r14" x="36" y="330" fill="#767e8a" xml:space="preserve">s1 t0-5  (h=human a=assistant hs=steering sum=summary)</text>
<text class="r r15" x="36" y="350" fill="#767e8a" xml:space="preserve">t0 2026-07-14 10:12:00 h: Webhook dispatch needs retries. Simplest version is a constant wait…</text>
<text class="r r16" x="36" y="370" fill="#767e8a" xml:space="preserve">t1 …10:13:00 a: I can add the constant-wait version to dispatcher.go, roughly twenty lines. B…</text>
<text class="r r18" x="20" y="410" fill="#59d499" font-weight="600" xml:space="preserve">This exact question came up before — and it was rejected. Per the ledger (session</text>
<text class="r r19" x="20" y="430" fill="#59d499" font-weight="600" xml:space="preserve">  01KZ2W9QKYVJQ2KTEZ1W21DS7X, 2026-07-14, commit 5885c99c):</text>
<text class="r r20" x="20" y="450" fill="#c9d1d9" xml:space="preserve">No, don't use a fixed 5s delay. It was explicitly tried and rejected: a fixed delay causes a</text>
<text class="r r21" x="20" y="470" fill="#c9d1d9" xml:space="preserve">  thundering-herd/retry-storm problem — every webhook that failed during an outage retries at</text>
<text class="r r22" x="20" y="490" fill="#c9d1d9" xml:space="preserve">  the same instant, and when the downstream endpoint comes back up, you self-DDoS it.</text>
<text class="r r23" x="20" y="510" fill="#c9d1d9" xml:space="preserve">What was decided instead:</text>
<text class="r r24" x="20" y="530" fill="#c9d1d9" xml:space="preserve">- Exponential backoff with full jitter: base 500ms, factor 2×, cap 60s — each delay randomized</text>
<text class="r r25" x="20" y="550" fill="#c9d1d9" xml:space="preserve">  in [0, computed] so retries spread across the window instead of all firing in sync.</text>
<text class="r r26" x="36" y="570" fill="#767e8a" xml:space="preserve">…</text>
</svg>