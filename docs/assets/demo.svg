<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
<title id="title">Carry the context forward.</title>
<desc id="desc">Illustrative three-step workflow: Dana captures a retry decision, Sam syncs and searches with Codex, then reads its original source. Synthetic content, abbreviated results.</desc>
<rect width="1000" height="790" rx="20" fill="#08080a"/>
<text x="35" y="48" fill="#e8e8ec" font-size="28" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Carry the context forward.</text>
<text x="35" y="81" fill="#8a8a94" font-size="17" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Git-backed memory for the decisions behind your code.</text>
<rect x="25" y="110" width="950" height="189" rx="12" fill="#101015" stroke="#2d2d38"/>
<text x="47" y="141" fill="#a79bff" font-size="17" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">01  KEEP THE DECISION</text>
<text x="47" y="169" fill="#91919e" font-size="14" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Dana / Claude Code / yesterday</text>
<text x="47" y="206" fill="#22d3ee" font-size="19" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">$ git commit -m &quot;Add jitter to webhook retries&quot;</text>
<text x="47" y="240" fill="#c7c7d1" font-size="17" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Fixed delays synchronized failing deliveries.</text>
<text x="47" y="267" fill="#c7c7d1" font-size="17" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Capture the discussion and project note at checkpoint.</text>
<rect x="25" y="317" width="950" height="189" rx="12" fill="#101015" stroke="#2d2d38"/>
<text x="47" y="348" fill="#a79bff" font-size="17" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">02  FIND IT AGAIN</text>
<text x="47" y="376" fill="#91919e" font-size="14" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Sam / Codex / today</text>
<text x="47" y="413" fill="#22d3ee" font-size="19" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">$ rekal &quot;why do webhook retries use jitter?&quot;</text>
<text x="47" y="447" fill="#c7c7d1" font-size="17" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">After rekal sync: find conversation leads and matching notes.</text>
<text x="47" y="474" fill="#c7c7d1" font-size="17" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Choose a source reference returned by search.</text>
<rect x="25" y="524" width="950" height="189" rx="12" fill="#101015" stroke="#2d2d38"/>
<text x="47" y="555" fill="#a79bff" font-size="17" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">03  READ BEFORE CHANGING</text>
<text x="47" y="583" fill="#91919e" font-size="14" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Sam / Codex / same task</text>
<text x="47" y="620" fill="#22d3ee" font-size="19" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">$ rekal query --ref &lt;returned-reference&gt;</text>
<text x="47" y="654" fill="#c7c7d1" font-size="17" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Read why jitter was chosen and which constraints mattered.</text>
<text x="47" y="681" fill="#c7c7d1" font-size="17" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Then check today&#x27;s implementation and tests.</text>
<text x="35" y="755" fill="#91919e" font-size="15" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Illustrative workflow / synthetic content / abbreviated results</text>
</svg>
