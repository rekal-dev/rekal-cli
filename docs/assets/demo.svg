<text x="546.0" y="233.5" fill="#59d499" font-size="10.5" text-anchor="middle">git push</text>
<text x="546.0" y="269.5" fill="#6e7681" font-size="9.5" text-anchor="middle">rekal/dana</text>
<text x="546.0" y="281.5" fill="#6e7681" font-size="9.5" text-anchor="middle">@team.dev</text>
<text x="546.0" y="297.5" fill="#6e7681" font-size="9.5" text-anchor="middle">no server</text>
</g>
