<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">New feature. Context ready.</title>
<desc id="desc">A terminal walkthrough: search existing project memory before adding invoice CSV export, read an original source, then build and commit. Synthetic content and abbreviated output.</desc>
<rect x="1" y="1" width="998" height="718" rx="18" fill="#0c0c12" stroke="#2d2d38"/>
<path d="M1 57H999" stroke="#2d2d38"/>
<circle cx="30" cy="29" r="6" fill="#fb7185"/>
<circle cx="54" cy="29" r="6" fill="#fbbf24"/>
<circle cx="78" cy="29" r="6" fill="#34d399"/>
<text x="118" y="36" fill="#9292a3" font-size="17" font-family="DejaVu Sans Mono,monospace">rekal / your-project</text>
<text x="32" y="100" fill="#e8e8ec" font-size="26" font-family="DejaVu Sans Mono,monospace">New feature. Context ready.</text>
<text x="32" y="147" fill="#a6a6b4" font-size="21" font-family="DejaVu Sans Mono,monospace"># New feature: export invoices as CSV</text>
<text x="32" y="175" fill="#22d3ee" font-size="21" font-family="DejaVu Sans Mono,monospace">$ rekal &quot;invoice export conventions&quot;</text>
<text x="32" y="231" fill="#a79bff" font-size="21" font-family="DejaVu Sans Mono,monospace">  Memory       exports.md</text>
<text x="32" y="259" fill="#e8e8ec" font-size="21" font-family="DejaVu Sans Mono,monospace">  Stream rows. Keep large exports out of memory.</text>
<text x="32" y="287" fill="#a79bff" font-size="21" font-family="DejaVu Sans Mono,monospace">  Conversation Invoice export design</text>
<text x="32" y="315" fill="#e8e8ec" font-size="21" font-family="DejaVu Sans Mono,monospace">  Use UTC timestamps. Exclude internal account IDs.</text>
<text x="32" y="343" fill="#9292a3" font-size="21" font-family="DejaVu Sans Mono,monospace">  ref: passage:demo-export:12-14</text>
<text x="32" y="399" fill="#22d3ee" font-size="21" font-family="DejaVu Sans Mono,monospace">$ rekal query --ref passage:demo-export:12-14</text>
<text x="32" y="455" fill="#e8e8ec" font-size="21" font-family="DejaVu Sans Mono,monospace">  [12] Export timestamps in UTC for reconciliation.</text>
<text x="32" y="483" fill="#e8e8ec" font-size="21" font-family="DejaVu Sans Mono,monospace">  [13] Keep internal account IDs out of the CSV.</text>
<text x="32" y="511" fill="#e8e8ec" font-size="21" font-family="DejaVu Sans Mono,monospace">  [14] Stream rows so large exports stay bounded.</text>
<text x="32" y="567" fill="#a6a6b4" font-size="21" font-family="DejaVu Sans Mono,monospace"># Build the feature with that context. Run the tests.</text>
<text x="32" y="595" fill="#22d3ee" font-size="21" font-family="DejaVu Sans Mono,monospace">$ git commit -m &quot;Add invoice CSV export&quot;</text>
<text x="32" y="623" fill="#a6a6b4" font-size="21" font-family="DejaVu Sans Mono,monospace"># Rekal checkpoints supported sessions and project notes.</text>
<text x="32" y="692" fill="#9292a3" font-size="15" font-family="DejaVu Sans Mono,monospace">Illustrative terminal output · synthetic context · already captured history</text>
</svg>
