name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version on main (e.g. v2.0.0); leave blank when selecting an existing tag"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rekal-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Resolve release version and commit
        id: ref
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/check_release_ref.py
      - name: Verify license
        run: |
          test -f LICENSE
          head -5 LICENSE | grep -q "Apache License"
      - uses: jdx/mise-action@v3
      - name: Build llama.cpp
        run: |
          git clone --depth 1 --branch b8157 https://github.com/ggml-org/llama.cpp .deps/llama.cpp
          cd .deps/llama.cpp
          cmake -B build \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build --config Release -j$(nproc) --target llama --target ggml --target common
      # Lint before the race suite so golangci-lint still has a warm, lightly
      # loaded runner — after test:ci, package load has been hitting the
      # previous 5m deadline on ubuntu-latest.
      - name: Lint
        run: mise run lint
      - name: Tests
        run: mise run test:ci

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}

      - name: Fetch LFS objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git lfs install
          git lfs fetch origin "$RELEASE_SHA"
          git lfs checkout

      - uses: jdx/mise-action@v3

      - name: Build llama.cpp
        run: |
          git clone --depth 1 --branch b8157 https://github.com/ggml-org/llama.cpp .deps/llama.cpp
          cd .deps/llama.cpp
          CMAKE_ARGS="-DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DLLAMA_METAL=ON"
          fi
          cmake -B build $CMAKE_ARGS
          cmake --build build --config Release -j$(nproc || sysctl -n hw.ncpu) --target llama --target ggml --target common

      # linux/amd64 and darwin/arm64 ship a committed FTS blob; linux/arm64
      # downloads it here so the binary can run recall offline. No-op for the
      # committed platforms.
      - name: Fetch FTS extension
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./scripts/fetch-fts-extension.sh

      - name: Build binary
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          go build -ldflags "-s -w -X github.com/rekal-dev/rekal-cli/cmd/rekal/cli.Version=${VERSION}" \
            -o rekal ./cmd/rekal

      - name: Verify binary version
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: test "$(./rekal version)" = "rekal ${RELEASE_TAG#v}"

      - name: Create archive
        run: |
          ARCHIVE="rekal_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar czf "${ARCHIVE}" rekal LICENSE README.md
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekal_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            rekal_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            rekal_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          for target in linux_amd64 linux_arm64 darwin_arm64; do
            test -s "rekal_${target}.tar.gz"
            test -s "rekal_${target}.tar.gz.sha256"
          done
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          sha256sum --check checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline "${PREV_TAG}..HEAD" --no-merges \
              --grep="^docs:" --grep="^test:" --grep="^chore:" --invert-grep)
          else
            CHANGELOG=$(git log --oneline HEAD --no-merges \
              --grep="^docs:" --grep="^test:" --grep="^chore:" --invert-grep)
          fi
          # Write to file to avoid delimiter issues
          echo "$CHANGELOG" > /tmp/changelog.txt

      # The tag is created only after validation, all native builds and checksum
      # verification. GITHUB_TOKEN tag pushes do not launch another workflow;
      # publication deliberately continues in this same run.
      - name: Create or verify release tag
        run: |
          git fetch origin main --tags
          python3 scripts/check_release_ref.py
          python3 scripts/ensure_release_tag.py
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A retry may resume a draft, but never replaces a published release.
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/release.json"))["isDraft"], "release is already published"'
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG" --notes-file /tmp/changelog.txt
          fi
          gh release upload "$RELEASE_TAG" dist/checksums.txt dist/*.tar.gz --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
