# Align Go version with go.mod (same as ref-projects/cli)
[tools]
go = { version = '1.25.6' }
golangci-lint = '2.8.0'

[tasks.fmt]
description = "Run gofmt"
run = "gofmt -s -w ."

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks."test:integration"]
description = "Run integration tests only"
run = "go test -tags=integration ./cmd/rekal/cli/integration_test/..."

[tasks."test:ci"]
description = "Run all tests (unit + integration) with race detection"
# -timeout is explicit because the integration suite now exceeds Go's 10m
# default under -race: each case drives real git repos, clones, DuckDB stores
# and CLI invocations, and the race detector multiplies all of it. Hitting the
# default kills the run mid-test and reports a goroutine dump rather than a
# failure, which reads like a hang and is not one.
run = "go test -tags=integration -race -timeout 25m ./..."

[tasks."test:coverage"]
description = "Run all tests and report statement coverage (HTML report in coverage.html)"
run = """
go test -tags=integration -coverprofile=coverage.out -coverpkg=./cmd/rekal/cli/... ./...
go tool cover -func=coverage.out | tail -1
go tool cover -html=coverage.out -o coverage.html
echo "open coverage.html for the line-by-line view"
"""

[tasks.lint]
description = "Run linters (gofmt check + golangci-lint)"
run = """
unformatted=$(gofmt -l -s .)
if [ -n "$unformatted" ]; then
  echo "These files need formatting. Run: mise run fmt"
  echo "$unformatted"
  exit 1
fi
# Release validate runs lint after a full race suite + llama build; 5m
# was timing out on package load (context deadline exceeded).
golangci-lint run --timeout=10m ./...
"""

[tasks."fetch-extensions"]
description = "Download the DuckDB FTS extension for this platform if it isn't committed (linux/arm64, darwin/amd64). No-op when the blob is already present."
run = "./scripts/fetch-fts-extension.sh"

[tasks.build]
description = "Build the CLI"
depends = ["fetch-extensions"]
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -ldflags "-X github.com/rekal-dev/rekal-cli/cmd/rekal/cli.Version=${VERSION}" -o rekal ./cmd/rekal
"""

[tasks."build:all"]
description = "Build for all platforms (snapshot)"
run = "goreleaser build --snapshot --clean"
