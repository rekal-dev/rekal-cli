<text x="400.0" y="20" fill="#767e8a" text-anchor="middle" font-size="11.5">payments-api</text>
<g class="r r0">
<text x="20" y="50" fill="#59d499">$</text>
<clipPath id="c0"><rect class="ty0" x="34" y="37" height="20" width="0"/></clipPath>
