<text x="482" y="20" fill="#6e7681" font-size="11" text-anchor="end">wrote it</text>
<text class="r r0" x="16" y="52.0" fill="#6e7681" font-style="italic" xml:space="preserve"># one command, once per repo</text>
<g class="r r1">
<text x="16" y="70.5" fill="#f0a35e">$</text>
<clipPath id="c1"><rect class="ty1" x="28" y="58.5" height="18.5" width="0"/></clipPath>
<text x="28" y="70.5" fill="#ffffff" clip-path="url(#c1)" xml:space="preserve">rekal init</text>
</g>
<text class="r r2" x="16" y="89.0" fill="#c9d1d9" xml:space="preserve">Rekal initialized.</text>
<text class="r r3" x="16" y="107.5" fill="#6e7681" font-style="italic" xml:space="preserve"># after that, nothing but normal git</text>
<text class="r r4" x="16" y="126.0" fill="#6e7681" font-style="italic" xml:space="preserve"># three weeks ago: one 37-turn session on webhook delivery</text>
<g class="r r5">
<text x="16" y="144.5" fill="#f0a35e">$</text>
<clipPath id="c5"><rect class="ty5" x="28" y="132.5" height="18.5" width="0"/></clipPath>
<text x="28" y="144.5" fill="#ffffff" clip-path="url(#c5)" xml:space="preserve">git commit -m 'feat(dispatch): retry webhooks with backoff'</text>
</g>
<text class="r r6" x="16" y="163.0" fill="#c9d1d9" xml:space="preserve">rekal: 1 session(s) captured</text>
<g class="r r7">
<text x="16" y="181.5" fill="#f0a35e">$</text>
<clipPath id="c7"><rect class="ty7" x="28" y="169.5" height="18.5" width="0"/></clipPath>
<text x="28" y="181.5" fill="#ffffff" clip-path="url(#c7)" xml:space="preserve">git push</text>
</g>
<text class="r r8" x="16" y="200.0" fill="#c9d1d9" xml:space="preserve">rekal: pushed to origin/rekal/dana@team.dev</text>
<rect x="598" width="494" height="495" rx="9" fill="#12141c"/>
<rect x="598" width="494" height="32" rx="9" fill="#1b1e29"/>
<rect x="598" y="23" width="494" height="9" fill="#1b1e29"/>
<circle cx="615" cy="16" r="4.5" fill="#7ab7ff"/>
<text x="628" y="20" fill="#7ab7ff" font-size="11.5" font-weight="600">sam@team.dev</text>
<text x="1080" y="20" fill="#6e7681" font-size="11" text-anchor="end">never saw it</text>
<text class="r r9" x="614" y="52.0" fill="#6e7681" font-style="italic" xml:space="preserve"># today, another machine. Never in that conversation.</text>
<g class="r r10">
<text x="614" y="70.5" fill="#7ab7ff">$</text>
<clipPath id="c10"><rect class="ty10" x="626" y="58.5" height="18.5" width="0"/></clipPath>
<text x="626" y="70.5" fill="#ffffff" clip-path="url(#c10)" xml:space="preserve">rekal sync</text>
</g>
<text class="r r11" x="614" y="89.0" fill="#c9d1d9" xml:space="preserve">rekal: synced — 0 local sessions, 1 remote sessions from 1 team m…</text>
<g class="r r12">
<text x="614" y="107.5" fill="#7ab7ff">$</text>
<clipPath id="c12"><rect class="ty12" x="626" y="95.5" height="18.5" width="0"/></clipPath>
<text x="626" y="107.5" fill="#ffffff" clip-path="url(#c12)" xml:space="preserve">claude "can we just use a fixed 5s retry delay?"</text>
</g>
<text class="r r13" x="614" y="126.0" fill="#c8a2f0" xml:space="preserve">● Skill(rekal)</text>
<text class="r r14" x="614" y="144.5" fill="#c8a2f0" xml:space="preserve">● Bash(rekal "webhook dispatcher retry delay backoff")</text>
<text class="r r15" x="628" y="163.0" fill="#7ab7ff" xml:space="preserve">INJECT top=0.74 gap=0.74 1 seeds</text>
<text class="r r16" x="628" y="181.5" fill="#6e7681" xml:space="preserve">  s1 conf=0.74 t0 "We're losing webhook deliveries when the…</text>
<text class="r r17" x="614" y="200.0" fill="#c8a2f0" xml:space="preserve">● Bash(rekal query --session s1 --offset 0 --limit 8)</text>
<text class="r r18" x="628" y="218.5" fill="#6e7681" xml:space="preserve">s1 t0-7  (h=human a=assistant hs=steering sum=summary)</text>
<text class="r r19" x="628" y="237.0" fill="#6e7681" xml:space="preserve">t0 h: We're losing webhook deliveries when the merchant end…</text>
<text class="r r20" x="628" y="255.5" fill="#6e7681" xml:space="preserve">t1 a: dispatcher.go:88, Dispatch() does an http.Post and lo…</text>
<text class="r r21" x="614" y="274.0" fill="#59d499" font-weight="600" xml:space="preserve">No — check what happened last time this came up. Session s1</text>
<text class="r r22" x="614" y="292.5" fill="#c9d1d9" xml:space="preserve">  (commit 2510ea64) already went through this exact question:</text>
<text class="r r23" x="614" y="311.0" fill="#c9d1d9" xml:space="preserve">The trail:</text>
<text class="r r24" x="614" y="329.5" fill="#c9d1d9" xml:space="preserve">- t5: assistant proposed a fixed 5s delay, 3 attempts, then</text>
<text class="r r25" x="614" y="348.0" fill="#c9d1d9" xml:space="preserve">  give up.</text>
<text class="r r26" x="614" y="366.5" fill="#c9d1d9" xml:space="preserve">- t6 (steering, rejected): "a fixed 5s delay stampedes the</text>
<text class="r r27" x="614" y="385.0" fill="#c9d1d9" xml:space="preserve">  downstream on recovery... after a 20 minute merchant outage,</text>
<text class="r r28" x="614" y="403.5" fill="#c9d1d9" xml:space="preserve">  every event that failed is aligned to the same tick. The</text>
<text class="r r29" x="614" y="422.0" fill="#c9d1d9" xml:space="preserve">  moment the endpoint comes back we deliver the entire backlog</text>
<text class="r r30" x="614" y="440.5" fill="#c9d1d9" xml:space="preserve">  in one synchronized burst and knock it straight back over."</text>
<text class="r r31" x="614" y="459.0" fill="#c9d1d9" xml:space="preserve">…</text>
