<text x="425.0" y="22" fill="#7d8590" text-anchor="middle" font-size="12">payments-api — rekal</text>
<g class="r r0">
<text x="22" y="52" fill="#59d499">$</text>
<clipPath id="c0"><rect class="t0" x="38" y="38" height="21" width="0"/></clipPath>
<text x="38" y="52" fill="#ffffff" clip-path="url(#c0)">git commit -m 'feat(dispatch): retry webhooks with exponential backoff and jitter'</text>
<text x="743.6" y="52" fill="#7d8590" font-size="12"># post-commit hook captures the session</text>
</g>
<text class="r r1" x="22" y="73" fill="#7d8590" xml:space="preserve">[main 1c62ead] feat(dispatch): retry webhooks with exponential backoff and jitter</text>
<text class="r r2" x="22" y="94" fill="#c9d1d9" xml:space="preserve"> 3 files changed, 7 insertions(+)</text>
<g class="r r4">
<text x="22" y="136" fill="#59d499">$</text>
<clipPath id="c4"><rect class="t4" x="38" y="122" height="21" width="0"/></clipPath>
<text x="38" y="136" fill="#ffffff" clip-path="url(#c4)">rekal "should webhook retries use a fixed delay?"</text>
</g>
<text class="r r5" x="22" y="157" fill="#7ab7ff" font-weight="600" xml:space="preserve">INJECT top=0.82 gap=0.15 2 seeds</text>
<text class="r r6" x="22" y="178" fill="#c9d1d9" xml:space="preserve">s1 conf=0.82 t2 "no, a fixed 5s delay stampedes the downstream on recovery. Every hook that</text>
<text class="r r7" x="22" y="199" fill="#c9d1d9" xml:space="preserve">failed during…"</text>
<text class="r r8" x="22" y="220" fill="#c9d1d9" xml:space="preserve">s2 conf=0.67 t2 "keep the key stable across retries specifically - regenerating per attempt</text>
<text class="r r9" x="22" y="241" fill="#c9d1d9" xml:space="preserve">defeats the whole point…"</text>
<text class="r r10" x="22" y="262" fill="#7ab7ff" font-weight="600" xml:space="preserve">KNOWLEDGE README.md=0.38</text>
<g class="r r12">
<text x="22" y="304" fill="#59d499">$</text>
<clipPath id="c12"><rect class="t12" x="38" y="290" height="21" width="0"/></clipPath>
<text x="38" y="304" fill="#ffffff" clip-path="url(#c12)">rekal query -s s1 --role human_steering</text>
</g>
<text class="r r13" x="22" y="325" fill="#c9d1d9" xml:space="preserve">s1 t2-4  (h=human a=assistant hs=steering sum=summary)</text>
<text class="r r14" x="22" y="346" fill="#c9d1d9" xml:space="preserve">t2 2026-07-14 10:14:00 hs: no, a fixed 5s delay stampedes the downstream on recovery. Every</text>
<text class="r r15" x="22" y="367" fill="#c9d1d9" xml:space="preserve">hook that failed during an outage retries at the same instant and we DDoS ourselves the moment</text>
<text class="r r16" x="22" y="388" fill="#c9d1d9" xml:space="preserve">the endpoint comes back. Use exponential backoff with jitter.</text>
<text class="r r17" x="22" y="409" fill="#c9d1d9" xml:space="preserve">t4 …10:16:00 hs: also cap the attempts. Five, then dead-letter - anything past five never</text>
<text class="r r18" x="22" y="430" fill="#c9d1d9" xml:space="preserve">lands and just burns queue throughput.</text>
<text class="r r19" x="22" y="451" fill="#c9d1d9" xml:space="preserve">commits:</text>
<text class="r r20" x="22" y="472" fill="#c9d1d9" xml:space="preserve">  1c62eadf feat(dispatch): retry webhooks with exponential backoff and jitter</text>
</svg>